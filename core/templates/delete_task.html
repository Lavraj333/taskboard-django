{% extends 'base.html' %}

{% block content %}
<h2>Delete Task</h2>

<p>Are you sure you want to delete "{{ task.title }}"?</p>

<form method="post">
    {% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, Delete</button>
</form>

<a href="/tasks/" class="btn btn-secondary">Cancel</a>
{% endblock %}
